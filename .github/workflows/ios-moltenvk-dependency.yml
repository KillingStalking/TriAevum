name: iOS MoltenVK dependency

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ios-moltenvk-port
    paths:
      - "scripts/ios/**"
      - "runtime/three_ds_recomp/cmake/dependencies/ios-vulkan.cmake"
      - "runtime/three_ds_recomp/cmake/dependencies/vulkan-compiler-dependencies.cmake"
      - ".github/workflows/ios-moltenvk-dependency.yml"

permissions:
  contents: read

concurrency:
  group: ios-moltenvk-dependency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-moltenvk:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out TriAevum
        uses: actions/checkout@v4

      - name: Show Apple build tools
        run: |
          xcodebuild -version
          cmake --version

      - name: Build pinned MoltenVK iOS XCFramework
        env:
          TRIAEVUM_IOS_DEPS_DIR: ${{ runner.temp }}/triaevum-ios-deps
        run: bash scripts/ios/build_moltenvk.sh

      - name: Upload static iOS MoltenVK XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: moltenvk-ios-static
          path: ${{ runner.temp }}/triaevum-ios-deps/MoltenVK/Package/Latest/MoltenVK/static/MoltenVK.xcframework
          if-no-files-found: error
          retention-days: 14
